services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: innovait_sales_db
    environment:
      POSTGRES_USER: innovait_user
      POSTGRES_PASSWORD: innovait_password
      POSTGRES_DB: innovait_sales
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U innovait_user -d innovait_sales"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
