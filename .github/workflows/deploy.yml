name: Deploy to AWS Free Tier (EC2)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-aws-ec2
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Validar y Sanitizar Host EC2
        id: prep
        run: |
          RAW_HOST="${{ secrets.AWS_EC2_HOST }}"
          # Eliminar http://, https://, puertos, barras y espacios accidentales
          CLEAN_HOST=$(echo "$RAW_HOST" | sed -e 's|^https\?://||' -e 's|:[0-9]\+$||' -e 's|/.*$||' | tr -d ' \r\n\t')
          echo "host=$CLEAN_HOST" >> "$GITHUB_OUTPUT"
          echo "Host procesado para conexión SSH: $CLEAN_HOST"

      - name: Verificar conectividad al puerto 22
        run: |
          nc -zv -w 10 ${{ steps.prep.outputs.host }} 22 || echo "Aviso: timeout intentando conectar al puerto 22 de ${{ steps.prep.outputs.host }}"

      - name: Ejecutar despliegue vía SSH en EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.prep.outputs.host }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          timeout: 60s
          command_timeout: 30m
          script: |
            set -e
            echo "=========================================="
            echo "🚀 Iniciando despliegue de Agentes B2B..."
            echo "=========================================="

            # 1. Configurar 2GB de memoria Swap si aún no existe (vital en t3.micro para compilar Next.js)
            if [ ! -f /swapfile ]; then
              echo "🧠 Configurando memoria Swap..."
              sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            fi

            # 2. Asegurar que Docker y Docker Compose estén instalados y funcionando
            if ! command -v docker >/dev/null 2>&1 || ! sudo docker compose version >/dev/null 2>&1; then
              echo "🐳 Instalando Docker y Docker Compose oficial..."
              curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
              sudo sh /tmp/get-docker.sh
              sudo usermod -aG docker ubuntu || true
              sudo systemctl enable docker
              sudo systemctl start docker
            fi

            # 3. Crear directorio de despliegue si no existe
            mkdir -p ~/innovait-app
            cd ~/innovait-app

            # 4. Clonar repositorio privado con token efímero o sincronizar cambios
            if [ ! -d ".git" ]; then
              echo "📥 Clonando repositorio privado..."
              find . -mindepth 1 -delete
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
            else
              echo "🔄 Actualizando cambios desde main..."
              git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
              git fetch origin main
              git reset --hard origin/main
            fi

            # Restaurar la URL remota sin credenciales por seguridad
            git remote set-url origin https://github.com/${{ github.repository }}.git

            # 5. Generar archivo .env en el servidor con los secretos configurados en GitHub
            echo "⚙️ Configurando variables de entorno..."
            > .env
            echo 'PROJECT_NAME="INNOVAIT B2B Multi-Agent Sales System"' >> .env
            echo 'ENVIRONMENT="production"' >> .env
            echo 'DEBUG="False"' >> .env
            echo 'API_V1_PREFIX="/api/v1"' >> .env
            echo 'GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"' >> .env
            echo 'APOLLO_API_KEY="${{ secrets.APOLLO_API_KEY }}"' >> .env
            echo 'HUNTER_API_KEY="${{ secrets.HUNTER_API_KEY }}"' >> .env
            echo 'LINKEDIN_PROXY_API_KEY="${{ secrets.LINKEDIN_PROXY_API_KEY }}"' >> .env
            echo 'POSTGRES_USER="innovait_user"' >> .env
            echo 'POSTGRES_PASSWORD="innovait_password"' >> .env
            echo 'POSTGRES_DB="innovait_sales"' >> .env
            echo 'NEXT_PUBLIC_API_URL="http://${{ steps.prep.outputs.host }}:8000/api/v1"' >> .env
            echo 'CORS_ORIGINS="*"' >> .env
            # Limpiar posibles espacios accidentales al inicio de los valores
            sed -i 's/=" */="/g' .env

            # 6. Permisos de lectura/escritura y despliegue de contenedores Docker
            sudo chmod -R 777 ~/innovait-app/backend/app/knowledge || true
            echo "🐳 Desplegando contenedores Docker..."
            sudo docker compose down || true
            sudo fuser -k 8000/tcp || true
            sudo docker compose up -d --build
            sudo chmod -R 777 ~/innovait-app/backend/app/knowledge || true

            echo "🔍 Verificando estado de contenedores en EC2..."
            sudo docker compose ps -a
            echo "📋 Inspeccionando logs iniciales del backend:"
            sleep 5
            sudo docker compose logs --tail=50 backend
            echo "📋 Inspeccionando logs iniciales del frontend:"
            sudo docker compose logs --tail=40 frontend

            echo "🧪 Probando respuesta del backend desde el host EC2..."
            curl -sS -i http://localhost:8000/ || echo "Aviso: Backend aún no responde en localhost:8000"
            curl -sS -i http://localhost:8000/api/v1/gates/pending || echo "Aviso: /api/v1/gates/pending aún no responde"

            # 7. Limpiar capas e imágenes antiguas para ahorrar espacio en disco (Free Tier)
            echo "🧹 Limpiando imágenes en desuso..."
            sudo docker image prune -f

            echo "=========================================="
            echo "✅ Despliegue completado con éxito."
            echo "Frontend: http://${{ steps.prep.outputs.host }}:3000"
            echo "Backend:  http://${{ steps.prep.outputs.host }}:8000/docs"
            echo "=========================================="
