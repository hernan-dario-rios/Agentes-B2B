name: Deploy to AWS Free Tier (EC2)

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Ejecutar despliegue vía SSH en EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER }}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          script: |
            set -e
            echo "=========================================="
            echo "🚀 Iniciando despliegue de Agentes B2B..."
            echo "=========================================="

            # 1. Configurar 2GB de memoria Swap si aún no existe (vital en t3.micro para compilar Next.js)
            if [ ! -f /swapfile ]; then
              echo "🧠 Configurando memoria Swap..."
              sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            fi

            # 2. Asegurar que Docker y Docker Compose estén instalados y funcionando
            if ! command -v docker >/dev/null 2>&1 || ! sudo docker compose version >/dev/null 2>&1; then
              echo "🐳 Instalando Docker y Docker Compose oficial..."
              curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
              sudo sh /tmp/get-docker.sh
              sudo usermod -aG docker ubuntu || true
              sudo systemctl enable docker
              sudo systemctl start docker
            fi

            # 3. Crear directorio de despliegue si no existe
            mkdir -p ~/innovait-app
            cd ~/innovait-app

            # 4. Clonar repositorio privado con token efímero o sincronizar cambios
            if [ ! -d ".git" ]; then
              echo "📥 Clonando repositorio privado..."
              find . -mindepth 1 -delete
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
            else
              echo "🔄 Actualizando cambios desde main..."
              git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
              git fetch origin main
              git reset --hard origin/main
            fi

            # Restaurar la URL remota sin credenciales por seguridad
            git remote set-url origin https://github.com/${{ github.repository }}.git

            # 5. Generar archivo .env en el servidor con los secretos configurados en GitHub
            echo "⚙️ Configurando variables de entorno..."
            cat << 'EOF' > .env
            PROJECT_NAME="INNOVAIT B2B Multi-Agent Sales System"
            ENVIRONMENT="production"
            DEBUG=False
            API_V1_PREFIX="/api/v1"
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            APOLLO_API_KEY=${{ secrets.APOLLO_API_KEY }}
            HUNTER_API_KEY=${{ secrets.HUNTER_API_KEY }}
            LINKEDIN_PROXY_API_KEY=${{ secrets.LINKEDIN_PROXY_API_KEY }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER || 'innovait_user' }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD || 'innovait_password' }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB || 'innovait_sales' }}
            NEXT_PUBLIC_API_URL=http://${{ secrets.AWS_EC2_HOST }}:8000/api/v1
            CORS_ORIGINS=["http://${{ secrets.AWS_EC2_HOST }}:3000","http://localhost:3000","http://${{ secrets.AWS_EC2_HOST }}:8000"]
            EOF

            # 6. Reconstruir y levantar contenedores Docker
            echo "🐳 Desplegando contenedores Docker..."
            sudo docker compose down || true
            sudo docker compose up -d --build

            # 7. Limpiar capas e imágenes antiguas para ahorrar espacio en disco (Free Tier)
            echo "🧹 Limpiando imágenes en desuso..."
            sudo docker image prune -f

            echo "=========================================="
            echo "✅ Despliegue completado con éxito."
            echo "Frontend: http://${{ secrets.AWS_EC2_HOST }}:3000"
            echo "Backend:  http://${{ secrets.AWS_EC2_HOST }}:8000/docs"
            echo "=========================================="
